<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect, useRef, useCallback } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
    import { Download, Clipboard, Link, BookText, FileText, XCircle, Copy, Loader2, Eye, EyeOff, RefreshCcw, Save, Upload, Sun, Moon, Columns2, Rows2, History, ChevronDown, ChevronUp, Zap, X, CheckCircle2, AlertCircle, Info, Search, Trash2, RotateCcw, Square, FileDown, Settings, Globe, Layers } from 'https://esm.sh/lucide-react@0.372.0';
    const h = React.createElement;

    // ═══════════════════════════════════════
    // CONSTANTS
    // ═══════════════════════════════════════
    const VERSION = '4.4.1';
    const MAX_PAYLOAD = 60000;
    const PROMPT_OVERHEAD = 800;
    const MAX_HISTORY = 20;
    const DEFAULT_CONCURRENCY = 3;
    const LANGUAGES = ['Auto-detect', 'English', 'Spanish', 'French', 'German', 'Italian', 'Portuguese', 'Chinese (Simplified)', 'Chinese (Traditional)', 'Japanese', 'Korean', 'Russian', 'Arabic', 'Hindi', 'Bengali', 'Urdu', 'Vietnamese', 'Turkish', 'Polish', 'Dutch', 'Swedish', 'Norwegian', 'Danish', 'Finnish', 'Greek', 'Hebrew', 'Thai', 'Indonesian', 'Malay', 'Filipino', 'Romanian', 'Hungarian', 'Czech', 'Slovak', 'Bulgarian', 'Serbian', 'Croatian', 'Ukrainian', 'Lithuanian', 'Latvian', 'Estonian', 'Slovenian', 'Catalan', 'Basque', 'Galician'];
    const TARGET_LANGUAGES = LANGUAGES.filter(l => l !== 'Auto-detect');

    const DEEPL_LANG_MAP = { 'English': 'EN', 'Spanish': 'ES', 'French': 'FR', 'German': 'DE', 'Italian': 'IT', 'Portuguese': 'PT', 'Chinese (Simplified)': 'ZH', 'Chinese (Traditional)': 'ZH', 'Japanese': 'JA', 'Korean': 'KO', 'Russian': 'RU', 'Arabic': 'AR', 'Hindi': 'HI', 'Vietnamese': 'VI', 'Turkish': 'TR', 'Polish': 'PL', 'Dutch': 'NL', 'Swedish': 'SV', 'Norwegian': 'NB', 'Danish': 'DA', 'Finnish': 'FI', 'Greek': 'EL', 'Hebrew': 'HE', 'Indonesian': 'ID', 'Romanian': 'RO', 'Hungarian': 'HU', 'Czech': 'CS', 'Slovak': 'SK', 'Bulgarian': 'BG', 'Serbian': 'SR', 'Croatian': 'HR', 'Ukrainian': 'UK', 'Lithuanian': 'LT', 'Latvian': 'LV', 'Estonian': 'ET', 'Slovenian': 'SL' };
    const LIBRE_LANG_MAP = { 'English': 'en', 'Spanish': 'es', 'French': 'fr', 'German': 'de', 'Italian': 'it', 'Portuguese': 'pt', 'Chinese (Simplified)': 'zh', 'Chinese (Traditional)': 'zt', 'Japanese': 'ja', 'Korean': 'ko', 'Russian': 'ru', 'Arabic': 'ar', 'Hindi': 'hi', 'Vietnamese': 'vi', 'Turkish': 'tr', 'Polish': 'pl', 'Dutch': 'nl', 'Swedish': 'sv', 'Norwegian': 'nb', 'Danish': 'da', 'Finnish': 'fi', 'Greek': 'el', 'Hebrew': 'he', 'Indonesian': 'id', 'Filipino': 'tl', 'Romanian': 'ro', 'Hungarian': 'hu', 'Czech': 'cs', 'Slovak': 'sk', 'Bulgarian': 'bg', 'Serbian': 'sr', 'Croatian': 'hr', 'Ukrainian': 'uk' };

    // ═══════════════════════════════════════
    // UTILITY FUNCTIONS
    // ═══════════════════════════════════════
    const fetchRetry = async (url, opts, retries = 5) => {
      for (let i = 0; i < retries; i++) {
        try {
          const r = await fetch(url, opts);
          // Retry on rate limits (429) or server errors (500+)
          if ((r.status === 429 || r.status >= 500) && i < retries - 1) {
            const delay = Math.pow(2, i) * 1000 + (Math.random() * 1000);
            console.warn(`[Retry ${i + 1}/${retries}] Status ${r.status}. Waiting ${Math.round(delay)}ms...`);
            await new Promise(t => setTimeout(t, delay));
            continue;
          }
          return r;
        } catch (e) {
          if (i === retries - 1) throw e;
          const delay = Math.pow(2, i) * 1000 + (Math.random() * 1000);
          console.warn(`[Retry ${i + 1}/${retries}] Network error: ${e.message}. Waiting ${Math.round(delay)}ms...`);
          await new Promise(t => setTimeout(t, delay));
        }
      }
    };
    const wordCount = t => t.trim() ? t.trim().split(/\s+/).length : 0;
    const charCount = t => t.length;
    const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

    // Parallel batch executor: runs tasks in batches of `concurrency`
    // Sliding Window Batch Executor: maintains a constant pool of `concurrency` active tasks.
    // Significantly faster than fixed-batch parallel for varying task durations.
    const batchConcurrent = async (items, fn, concurrency = 3) => {
      const results = new Array(items.length);
      let currentIndex = 0;
      const pool = Array(Math.min(concurrency, items.length)).fill(null).map(async () => {
        while (currentIndex < items.length) {
          const i = currentIndex++;
          try {
            results[i] = await fn(items[i], i);
          } catch (e) {
            results[i] = { error: e.message || 'Unknown error' };
          }
        }
      });
      await Promise.all(pool);
      return results;
    };
    const cleanText = t => { let c = t.replace(/\r\n|\r/g, '\n'); c = c.replace(/[ \t]{2,}/g, ' '); c = c.replace(/(\n\s*){2,}/g, '\n\n'); return c.trim() };
    const copyText = async t => { await navigator.clipboard.writeText(t) };

    // ═══════════════════════════════════════
    // INDEXEDDB SESSION STORAGE
    // ═══════════════════════════════════════
    const SessionDB = {
      dbName: 'GeminiTranslatorSessions',
      version: 1,
      getDB() {
        return new Promise((res, rej) => {
          const req = indexedDB.open(this.dbName, this.version);
          req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions');
          };
          req.onsuccess = e => res(e.target.result);
          req.onerror = e => rej(e.target.error);
        });
      },
      async set(key, value) {
        const db = await this.getDB();
        return new Promise((res, rej) => {
          const tx = db.transaction('sessions', 'readwrite');
          tx.objectStore('sessions').put(value, key);
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
        });
      },
      async get(key) {
        const db = await this.getDB();
        return new Promise((res, rej) => {
          const tx = db.transaction('sessions', 'readonly');
          const req = tx.objectStore('sessions').get(key);
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
      },
      async delete(key) {
        const db = await this.getDB();
        return new Promise((res, rej) => {
          const tx = db.transaction('sessions', 'readwrite');
          tx.objectStore('sessions').delete(key);
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
        });
      }
    };

    const splitChunks = (text, glossaryLen = 0) => {
      let max = MAX_PAYLOAD - PROMPT_OVERHEAD - glossaryLen;
      if (max <= 0) max = 500;
      const chunks = []; let rem = text;
      while (rem.length > 0) {
        if (rem.length <= max) { chunks.push(rem); break }
        let sp = max;
        let idx = rem.lastIndexOf('\n\n', max);
        if (idx !== -1 && idx > max * 0.7) sp = idx + 2;
        else {
          idx = rem.lastIndexOf('\n', max); if (idx !== -1 && idx > max * 0.7) sp = idx + 1;
          else { idx = Math.max(rem.lastIndexOf('.', max), rem.lastIndexOf('?', max), rem.lastIndexOf('!', max)); if (idx !== -1 && idx > max * 0.7) sp = idx + 1 }
        }
        if (sp <= 0) sp = max;
        chunks.push(rem.substring(0, sp)); rem = rem.substring(sp).trimStart();
      }
      return chunks;
    };

    // Default Glossaries
    const DEFAULT_PRESETS = [
      { id: 'none', name: 'None' },
      { id: 'wuxia', name: 'Wuxia / Cultivation Preset', terms: 'Dao, Qi, Cultivation, Tribulation, Heavenly, Sect, Grandmaster\nTranslate names as pinyin without tone marks. Keep honorifics like "Senior Brother".' },
      { id: 'scifi', name: 'Sci-Fi Preset', terms: 'FTL, Mecha, Cyborg, Warp, Neutrino\nUse hard-science fiction terminology.' }
    ];

    // ═══════════════════════════════════════
    // TRANSLATION PROVIDERS
    // ═══════════════════════════════════════
    const buildPrompt = (text, srcLang, tgtLang, glossary, instructions, prevContext) => {
      let p = `Please translate the following text${srcLang && srcLang !== 'Auto-detect' ? ' from ' + srcLang : ''} into ${tgtLang}. IMPORTANT: Preserve all original paragraph breaks and line breaks exactly.\n\n`;
      if (prevContext) {
        p += `[PREVIOUS CONTEXT START]\n${prevContext}\n[PREVIOUS CONTEXT END]\n\n---NOVEL CHUNK TO TRANSLATE---\n`;
      }
      p += `${text}\n\nProvide ONLY the ${tgtLang} translation. No commentary.`;
      if (glossary.trim()) p = `Use this Terminology Guide for specific terms.\n---\nTerminology Guide:\n${glossary.trim()}\n---\n\n` + p;
      if (instructions.trim()) p = `Additional instructions: ${instructions.trim()}\n\n` + p;
      return p;
    };

    const translateGemini = async (text, { apiKey, model, srcLang, tgtLang, glossary, instructions, signal, prevContext }) => {
      if (!apiKey) throw new Error('Gemini API key required.');
      const prompt = buildPrompt(text, srcLang, tgtLang, glossary, instructions, prevContext);
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const r = await fetchRetry(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }] }), signal });
      if (!r.ok) { const b = await r.text().catch(() => ''); throw new Error(`Gemini API error ${r.status}: ${b.substring(0, 200)}`); }
      const j = await r.json();
      const t = j?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!t) throw new Error('Unexpected Gemini response format.');
      return t.replace(/---CONTEXT_UPDATE---/g, '');
    };

    const streamGemini = async (text, { apiKey, model, srcLang, tgtLang, glossary, instructions, signal, onChunk, prevContext }) => {
      if (!apiKey) throw new Error('Gemini API key required.');
      const prompt = buildPrompt(text, srcLang, tgtLang, glossary, instructions, prevContext);
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${apiKey}`;
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }] }), signal });
      if (!r.ok) { const b = await r.text().catch(() => ''); throw new Error(`Gemini stream error ${r.status}: ${b.substring(0, 200)}`); }
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
      while (true) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop() || '';
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const d = line.slice(6).trim(); if (d === '[DONE]') return;
            try { const j = JSON.parse(d); let t = j?.candidates?.[0]?.content?.parts?.[0]?.text; if (t) { t = t.replace(/---CONTEXT_UPDATE---/g, ''); onChunk(t) } } catch (e) { }
          }
        }
      }
    };

    const translateDeepL = async (text, { apiKey, srcLang, tgtLang, signal }) => {
      if (!apiKey) throw new Error('DeepL API key required.');
      const tgt = DEEPL_LANG_MAP[tgtLang]; if (!tgt) throw new Error(`DeepL doesn't support ${tgtLang}.`);
      const src = srcLang && srcLang !== 'Auto-detect' ? DEEPL_LANG_MAP[srcLang] : undefined;
      const params = new URLSearchParams({ text, target_lang: tgt });
      if (src) params.append('source_lang', src);
      const base = apiKey.endsWith(':fx') ? 'https://api-free.deepl.com' : 'https://api.deepl.com';
      const r = await fetchRetry(`${base}/v2/translate`, { method: 'POST', headers: { 'Authorization': `DeepL-Auth-Key ${apiKey}`, 'Content-Type': 'application/x-www-form-urlencoded' }, body: params.toString(), signal });
      if (!r.ok) { const b = await r.text().catch(() => ''); throw new Error(`DeepL error ${r.status}: ${b.substring(0, 200)}`); }
      const j = await r.json(); return j.translations?.[0]?.text || '';
    };

    const translateLibre = async (text, { srcLang, tgtLang, signal, libreUrl, apiKey }) => {
      const tgt = LIBRE_LANG_MAP[tgtLang]; if (!tgt) throw new Error(`LibreTranslate doesn't support ${tgtLang}.`);
      const src = srcLang && srcLang !== 'Auto-detect' ? (LIBRE_LANG_MAP[srcLang] || 'auto') : 'auto';
      const url = libreUrl || 'https://libretranslate.com';
      const body = { q: text, source: src, target: tgt, format: 'text' };
      if (apiKey) body.api_key = apiKey;
      const r = await fetchRetry(`${url}/translate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal });
      if (!r.ok) { const b = await r.text().catch(() => ''); throw new Error(`LibreTranslate error ${r.status}: ${b.substring(0, 200)}`); }
      const j = await r.json(); return j.translatedText || '';
    };

    const translateOpenAI = async (text, { apiKey, srcLang, tgtLang, glossary, instructions, prevContext }) => {
      if (!apiKey) throw new Error('OpenAI API key required.');
      const prompt = buildPrompt(text, srcLang, tgtLang, glossary, instructions, prevContext);
      const r = await fetchRetry('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: [{ role: 'system', content: 'You are a professional literary translator.' }, { role: 'user', content: prompt }],
          temperature: 0.3
        })
      });
      if (!r.ok) { const b = await r.text().catch(() => ''); throw new Error(`OpenAI HTTP ${r.status}: ${b.substring(0, 200)}`) }
      const d = await r.json(); return d.choices[0].message.content.trim();
    };

    const translateClaude = async (text, { apiKey, srcLang, tgtLang, glossary, instructions, prevContext }) => {
      if (!apiKey) throw new Error('Claude API key required.');
      const prompt = buildPrompt(text, srcLang, tgtLang, glossary, instructions, prevContext);
      const r = await fetchRetry('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({
          model: 'claude-3-5-haiku-latest',
          max_tokens: 4000,
          system: 'You are a professional literary translator.',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.3
        })
      });
      if (!r.ok) { const b = await r.text().catch(() => ''); throw new Error(`Anthropic HTTP ${r.status}: ${b.substring(0, 200)}`) }
      const d = await r.json(); return d.content[0].text.trim();
    };

    const translateChunk = async (text, opts) => {
      switch (opts.provider) {
        case 'deepl': return translateDeepL(text, opts);
        case 'libre': return translateLibre(text, opts);
        case 'openai': return translateOpenAI(text, opts);
        case 'claude': return translateClaude(text, opts);
        default: return translateGemini(text, opts);
      }
    };

    const fetchGeminiModels = async (apiKey) => {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}&pageSize=100`);
      if (!r.ok) throw new Error('Failed to fetch models');
      const j = await r.json();
      return (j.models || []).filter(m => m.supportedGenerationMethods?.includes('generateContent')).map(m => ({ id: m.name.replace('models/', ''), name: m.displayName || m.name.replace('models/', '') }));
    };

    // ═══════════════════════════════════════
    // ERROR BOUNDARY
    // ═══════════════════════════════════════
    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { hasError: false, error: null } }
      static getDerivedStateFromError(e) { return { hasError: true, error: e } }
      render() { if (this.state.hasError) return h('div', { className: 'min-h-screen flex items-center justify-center bg-red-50 dark:bg-gray-900 p-8' }, h('div', { className: 'max-w-lg text-center' }, h('h1', { className: 'text-2xl font-bold text-red-600 mb-4' }, 'Something went wrong'), h('p', { className: 'text-gray-700 dark:text-gray-300 mb-4' }, this.state.error?.message), h('button', { onClick: () => this.setState({ hasError: false, error: null }), className: 'px-6 py-2 bg-indigo-600 text-white rounded-lg' }, 'Try Again'))); return this.props.children }
    }

    // ═══════════════════════════════════════
    // MAIN APP
    // ═══════════════════════════════════════
    function App() {
      // --- Core State ---
      const [inputText, setInputText] = useState('');
      const [assembledText, setAssembledText] = useState('');
      const [terminology, setTerminology] = useState('');
      const [customInstructions, setCustomInstructions] = useState('');
      const [activeTab, setActiveTab] = useState('text');
      const [error, setError] = useState('');

      // --- Translation State ---
      const [isTranslating, setIsTranslating] = useState(false);
      const [progress, setProgress] = useState(0);
      const [progressLabel, setProgressLabel] = useState('');
      const [translatedChapters, setTranslatedChapters] = useState([]);
      const [hasTextSession, setHasTextSession] = useState(false);
      const [hasEbookSession, setHasEbookSession] = useState(false);

      // --- Provider State ---
      const [provider, setProvider] = useState(() => localStorage.getItem('translationProvider') || 'gemini');
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('geminiApiKey') || '');
      const [geminiKeyInput, setGeminiKeyInput] = useState(() => localStorage.getItem('geminiApiKey') || '');
      const [deeplKey, setDeeplKey] = useState(() => localStorage.getItem('deeplApiKey') || '');
      const [deeplKeyInput, setDeeplKeyInput] = useState(() => localStorage.getItem('deeplApiKey') || '');
      const [openaiKey, setOpenaiKey] = useState(() => localStorage.getItem('openaiApiKey') || '');
      const [openaiKeyInput, setOpenaiKeyInput] = useState(() => localStorage.getItem('openaiApiKey') || '');
      const [claudeKey, setClaudeKey] = useState(() => localStorage.getItem('claudeApiKey') || '');
      const [claudeKeyInput, setClaudeKeyInput] = useState(() => localStorage.getItem('claudeApiKey') || '');
      const [libreUrl, setLibreUrl] = useState(() => localStorage.getItem('libreUrl') || 'https://libretranslate.com');
      const [libreKey, setLibreKey] = useState(() => localStorage.getItem('libreApiKey') || '');
      const [libreKeyInput, setLibreKeyInput] = useState(() => localStorage.getItem('libreApiKey') || '');
      const [geminiModel, setGeminiModel] = useState(() => localStorage.getItem('geminiModel') || 'gemini-2.5-flash');
      const [availableModels, setAvailableModels] = useState([]);
      const [customModel, setCustomModel] = useState('');
      const [useCustomModel, setUseCustomModel] = useState(false);
      const [showGeminiKey, setShowGeminiKey] = useState(false);
      const [showDeeplKey, setShowDeeplKey] = useState(false);
      const [showOpenaiKey, setShowOpenaiKey] = useState(false);
      const [showClaudeKey, setShowClaudeKey] = useState(false);
      const [showLibreKey, setShowLibreKey] = useState(false);
      const [enableStreaming, setEnableStreaming] = useState(() => localStorage.getItem('enableStreaming') === 'true');
      const [concurrency, setConcurrency] = useState(() => parseInt(localStorage.getItem('concurrency')) || DEFAULT_CONCURRENCY);

      // --- Language State ---
      const [srcLang, setSrcLang] = useState('Auto-detect');
      const [tgtLang, setTgtLang] = useState('English');
      const [customTgtLang, setCustomTgtLang] = useState('');
      const [useCustomTgtLang, setUseCustomTgtLang] = useState(false);

      // --- Glossary State ---
      const [savedGlossaries, setSavedGlossaries] = useState([]);
      const [newGlossaryName, setNewGlossaryName] = useState('');
      const [activeGlossaryId, setActiveGlossaryId] = useState(null);
      const [defaultGlossaryName, setDefaultGlossaryName] = useState(() => localStorage.getItem('defaultGlossaryName') || null);

      // --- UI State ---
      const [darkMode, setDarkMode] = useState(() => { const s = localStorage.getItem('darkMode'); return s !== null ? s === 'true' : window.matchMedia('(prefers-color-scheme:dark)').matches });
      const [toasts, setToasts] = useState([]);
      const [sideBySide, setSideBySide] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [modalMessage, setModalMessage] = useState('');

                                          Cover (Optional)</label>
                                      <div class="flex items-center gap-4">
                                          <div id="cover-preview"
                                              class="w-12 h-16 bg-slate-200 dark:bg-slate-700 rounded border border-slate-300 dark:border-slate-600 flex items-center justify-center overflow-hidden shrink-0 cursor-pointer object-cover"
                                              title="Click to upload custom cover">
                                              <span class="text-[10px] leading-tight text-slate-400 text-center px-1">Book
                                                  1<br>Cover</span>
                                          </div>
                                          <div class="flex-1">
                                              <input type="file" id="cover-input"
                                                  accept="image/jpeg, image/png, image/webp" class="hidden">
                                              <button type="button" id="btn-select-cover"
                                                  class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-white rounded-lg text-sm font-medium transition-colors">
                                                  Upload Image
                                              </button>
                                              <button type="button" id="btn-remove-cover"
                                                  class="hidden ml-2 px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-600 dark:bg-red-900/30 dark:hover:bg-red-900/50 dark:text-red-400 rounded-lg text-sm font-medium transition-colors">
                                                  Remove
                                              </button>
                                          </div>
                                      </div>
                                  </div>
                              </div>
  
                              <details
                                  class="mb-6 group bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
                                  <summary
                                      class="cursor-pointer p-4 font-bold text-slate-700 dark:text-slate-300 flex items-center justify-between select-none">
                                      <span>Advanced Settings</span>
                                      <svg class="w-5 h-5 transition-transform group-open:rotate-180"
                                          xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                          <path fill-rule="evenodd"
                                              d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                                              clip-rule="evenodd" />
                                      </svg>
                                  </summary>
                                  <div
                                      class="p-4 pt-0 grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-200 dark:border-slate-700">
                                      <div>
                                          <label
                                              class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Author
                                              / Creator</label>
                                          <input type="text" id="merge-author"
                                              class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-medium text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-fuchsia-500">
                                      </div>
                                      <div>
                                          <label
                                              class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Publisher</label>
                                          <input type="text" id="merge-publisher"
                                              class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-medium text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-fuchsia-500">
                                      </div>
                                      <div>
                                          <label
                                              class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Language</label>
                                          <input type="text" id="merge-language" value="en"
                                              class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-medium text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-fuchsia-500">
                                      </div>
                                      <div>
                                          <label
                                              class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Compression</label>
                                          <select id="merge-compression"
                                              class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-medium text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-fuchsia-500 h-[38px]">
                                              <option value="DEFLATE">Small File (DEFLATE max)</option>
                                              <option value="STORE" selected>Fast Speed (STORE uncompressed)</option>
                                          </select>
                                      </div>
                                  </div>
                              </details>
  
                               <button type="button" id="btn-execute-merge"
                                  class="w-full bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-sm disabled:opacity-50 flex items-center justify-center gap-2">
                                  <span id="merge-btn-text">Merge & Download</span>
                                  <div id="merge-spinner"
                                      class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin">
                                  </div>
                              </button>
  
                              <div id="merge-progress-wrapper" class="hidden mt-4">
                                  <div
                                      class="flex justify-between text-xs mb-1 font-bold text-slate-500 dark:text-slate-400">
                                      <span id="merge-progress-status">Compressing Final File...</span>
                                      <span id="merge-progress-percent">0%</span>
                                  </div>
                                  <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2 overflow-hidden">
                                      <div id="merge-progress-bar"
                                          class="bg-fuchsia-500 h-2 transition-all duration-100 ease-out"
                                          style="width: 0%"></div>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
  
      </div>
  
      <!-- Chapter Preview Modal -->
      <div id="chapter-preview-modal"
          class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
          onclick="if(event.target===this)this.classList.add('hidden')">
          <div
              class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 max-w-2xl w-full max-h-[80vh] flex flex-col overflow-hidden">
              <div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-700">
                  <h3 id="preview-modal-title" class="font-bold text-slate-800 dark:text-white truncate">Chapter Preview
                  </h3>
                  <button onclick="document.getElementById('chapter-preview-modal').classList.add('hidden')"
                      class="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-red-500 text-lg font-bold">✕</button>
              </div>
              <div id="preview-modal-body"
                  class="p-6 overflow-y-auto custom-scrollbar text-sm text-slate-700 dark:text-slate-300 leading-relaxed font-serif">
              </div>
          </div>
      </div>
  
                      <!-- Export History Panel -->
                      <div class="mt-8 pt-8 border-t border-slate-200 dark:border-slate-700">
                          <details id="export-history-panel" class="group bg-slate-50 dark:bg-slate-900/50 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
                              <summary class="cursor-pointer p-4 font-bold text-slate-700 dark:text-slate-300 flex items-center justify-between select-none">
                                  <div class="flex items-center gap-2">
                                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                                      </svg>
                                      <span>Export History</span>
                                  </div>
                                  <svg class="w-5 h-5 transition-transform group-open:rotate-180" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                      <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                                  </svg>
                              </summary>
                              <div class="p-4 pt-0">
                                  <div id="export-history-list" class="space-y-1 max-h-60 overflow-y-auto custom-scrollbar pr-2 mb-3">
                                      <!-- History items injected here -->
                                  </div>
                                  <button type="button" id="btn-clear-history" class="text-xs font-bold text-red-500 hover:text-red-700 dark:hover:text-red-400 hover:underline flex items-center gap-1">
                                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                          <polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                      </svg>
                                      Clear Export History
                                  </button>
                              </div>
                          </details>
                      </div>
                  ` },
                className: "epub-studio-injected-container"
              })
            )
          ),

          // Error display
          error && h('div', { className: 'flex items-center justify-between p-4 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 rounded-r-lg', 'role': 'alert' },
            h('p', { className: 'text-sm font-medium text-red-700 dark:text-red-400' }, error),
            btn({ onClick: () => setError(''), className: 'text-red-500 hover:text-red-700', 'aria-label': 'Dismiss error' }, ic(X, 18))
          )
        ),

        // TOASTS
        h('div', { className: 'fixed bottom-4 right-4 z-50 space-y-2', role: 'status', 'aria-live': 'polite' },
          toasts.map(t => h('div', { key: t.id, className: `toast-enter flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm font-medium ${t.type === 'error' ? 'bg-red-600 text-white' : t.type === 'info' ? 'bg-blue-600 text-white' : 'bg-green-600 text-white'}` },
            ic(t.type === 'error' ? AlertCircle : t.type === 'info' ? Info : CheckCircle2, 16), t.msg
          ))
        ),

        // MODAL
        showModal && h('div', { className: 'fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4', role: 'dialog', 'aria-modal': 'true' },
          h('div', { className: 'bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-6 max-w-sm w-full space-y-4' },
            h('p', { className: 'text-lg font-semibold text-center' }, modalMessage),
            h('div', { className: 'flex justify-center gap-3' },
              btn({ onClick: () => { if (modalCallback) modalCallback() }, className: 'px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold' }, 'Confirm'),
              btn({ onClick: () => { setShowModal(false); setModalCallback(null) }, className: 'px-6 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 font-semibold' }, 'Cancel')
            )
          )
        ),

        // FOOTER
        h('footer', { className: 'text-center text-xs text-gray-400 py-4' }, 'Gemini Translator v', VERSION, ' · Powered by Gemini, DeepL & LibreTranslate')
      );
    }

    const root = document.getElementById('root');
    if (root) ReactDOM.createRoot(root).render(h(ErrorBoundary, null, h(App)));

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.onupdatefound = () => {
            const w = reg.installing;
            if (w) w.onstatechange = () => { if (w.state === 'installed' && navigator.serviceWorker.controller) alert('New version installed! Refresh to update.'); };
          };
        }).catch(err => console.error('SW reg failed:', err));
      });
    }
  </script>
</body>

</html>
